<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفاصيل السحب</title>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        .header { padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid #181a20; }
        .back-btn { font-size: 1.5em; text-decoration: none; color: #eaecef; margin-left: 20px; }
        .content { padding: 30px 20px; text-align: center; }
        .amount { font-size: 2.5em; font-weight: bold; margin-bottom: 5px; }
        .status-badge { color: #fcd535; font-size: 0.9em; margin-bottom: 30px; }
        .timeline { text-align: right; padding: 20px; background-color: #181a20; border-radius: 10px; margin-bottom: 20px; border: 1px solid #2b3139;}
        .timeline-item { position: relative; padding-right: 20px; margin-bottom: 20px; color: #eaecef;}
        .timeline-item::before { content: ''; position: absolute; right: 0; top: 5px; width: 10px; height: 10px; border-radius: 50%; background-color: #848e9c; }
        .timeline-item.active::before { background-color: #fcd535; }
        .timeline-title { font-weight: bold; font-size: 0.9em; margin-bottom: 5px; }
        .timeline-date { font-size: 0.75em; color: #848e9c; }
        .details-box { text-align: right; font-size: 0.85em; padding: 0 10px;}
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #181a20; padding-bottom: 10px;}
        .detail-label { color: #848e9c; }
        .detail-value { font-weight: bold; word-break: break-all; text-align: left; max-width: 60%;}
        .btn-again { background-color: #181a20; color: #eaecef; width: 90%; padding: 15px; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; position: fixed; bottom: 20px; left: 5%; border: 1px solid #2b3139;}
    </style>
</head>
<body>
    <div class="header">
        <a href="/wallet/" class="back-btn">➔</a>
        <h3 style="margin: 0; flex-grow: 1; text-align: center; padding-right: 20px;">تفاصيل السحب</h3>
    </div>

    <div class="content">
        <div class="amount">{{ req.amount|floatformat:"2g" }} USDT</div>
        <div class="status-badge">🕒 {{ req.get_status_display }}</div>

        <div class="timeline">
            <div class="timeline-item active">
                <div class="timeline-title">تم تقديم طلب السحب</div>
                <div class="timeline-date">{{ req.created_at|date:"Y.m.d H:i" }}</div>
            </div>
            <div class="timeline-item active">
                <div class="timeline-title">قيد المعالجة</div>
                <div class="timeline-date">يرجى الانتظار لموافقة الإدارة</div>
            </div>
        </div>

        <div class="details-box">
            <div class="detail-row">
                <span class="detail-label">الشبكة</span>
                <span class="detail-value">{{ req.network }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">العنوان</span>
                <span class="detail-value">{{ req.wallet_address }}</span>
            </div>
        </div>
    </div>

    <button class="btn-again" onclick="window.location.href='/wallet/'">العودة للمحفظة</button>
</body>
</html>

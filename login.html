<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
</head>
<body style="text-align: center; font-family: Arial; margin-top: 50px;">
    <h2>تسجيل الدخول لحسابك</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px; background-color: #2c3e50; color: white;">دخول</button>
    </form>
    <br>
    <a href="/register/">ليس لديك حساب؟ سجل الآن</a>
</body>
</html>

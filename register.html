<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مستثمر جديد</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #58a6ff;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #f2f2f2;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #1f6feb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #388bfd;
        }
        .link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #8b949e;
            text-decoration: none;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>إنشاء حساب في منصة الاستثمار</h2>
        <form method="POST">
            {% csrf_token %}
            <label>اسم المستثمر:</label>
            <input type="text" name="name" required>

            <label>رقم الهاتف:</label>
            <input type="text" name="phone" required>

            <label>البريد الإلكتروني:</label>
            <input type="email" name="email" required placeholder="example@gmail.com">

            <label>كلمة المرور:</label>
            <input type="password" name="password" required>

            <button type="submit">تسجيل الآن</button>
        </form>
        <a class="link" href="/login">لديك حساب مسبقاً؟ تسجيل الدخول</a>
    </div>
</body>
</html>

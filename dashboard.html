<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظتي الاستثمارية</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #161b22;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #30363d;
        }
        .header h2 {
            margin: 0;
            color: #58a6ff;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .wallet-card {
            background-color: #161b22;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .wallet-card h3 {
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            color: #8b949e;
        }
        .token-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #21262d;
        }
        .token-item:last-child {
            border-bottom: none;
        }
        .token-info {
            display: flex;
            flex-direction: column;
        }
        .token-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #f2f2f2;
        }
        .token-symbol {
            font-size: 0.85em;
            color: #8b949e;
        }
        .token-balance {
            font-size: 1.3em;
            font-weight: bold;
            color: #3fb950;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>مرحباً بك، {{ investor.name }}</h2>
    </div>

    <div class="container">
        <div class="wallet-card">
            <h3>الأرصدة والعملات</h3>
            
            {% if balances %}
                {% for item in balances %}
                <div class="token-item">
                    <div class="token-info">
                        <span class="token-name">{{ item.token.name }}</span>
                        <span class="token-symbol">{{ item.token.symbol }}</span>
                    </div>
                    <div class="token-balance">
                        {{ item.balance }}
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <p style="text-align: center; color: #ff7b72;">لا توجد أرصدة متاحة في محفظتك حالياً.</p>
            {% endif %}
            
        </div>
    </div>

</body>
</html>
